name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Install wasm-opt
        run: cargo install wasm-opt --version 0.116.1 --locked

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build:all

      - name: Run tests
        run: pnpm test

      - name: Verify build artifacts
        run: |
          echo "Checking for build artifacts..."
          ls -la main.wasm
          ls -la dist/
          echo "Build completed successfully!"

  browser-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Install wasm-opt
        run: cargo install wasm-opt --version 0.116.1 --locked

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build:all

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:browser
